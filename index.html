<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="fav.png">

    <title>Sorry Mansi ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section>

        <!-- Background Video -->
        <div class="video-background">
            <video autoplay loop muted playsinline>
                <source src="heart.webm" type="video/webm">
            </video>
        </div>

        <div class="container">

            <div class="image-box">

                <div class="actual-image">
                    <img
                        src="cat-heart.gif"
                        alt="cute cat"
                        class="gif"
                        id="gif"
                    >
                </div>

                <div class="text-one">
                    <p id="text">
                        Mansi, sorry yaaa 🥺❤️
                    </p>
                </div>

            </div>

            <div class="yes-no">

                <button class="yes" id="yes">
                    Haan ❤️
                </button>

                <button class="no" id="no">
                    Nahi 😤
                </button>

            </div>

        </div>

    </section>

    <script src="app.js"></script>

</body>

</html>
