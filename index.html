<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="fav.png">

    <title>Sorry Mansi ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ==============================
   LANDING OVERLAY (PAGE 1)
============================== -->
<div class="landing-screen" id="landingScreen">
    <div class="landing-card">
        <div class="letter-wrapper">
            <img src="letter.png" alt="Letter" class="letter-img">
        </div>
        <button class="open-btn" id="openBtn"><span>Open Me ❤️</span></button>
    </div>
</div>

<!-- ==============================
   MAIN CONTENT (PAGE 2)
============================== -->
<section>

    <div class="video-background">
        <video id="video" autoplay loop muted playsinline>
            <source src="heart.webm" type="video/webm">
        </video>
    </div>

    <div class="container">

        <div class="image-box">

            <div class="actual-image">
                <img
                    src="cat-heart.gif"
                    id="gif"
                    class="gif"
                    alt="Cute cat"
                >
            </div>

            <div class="text-one">
                <p id="text">
                    Mansi 🥺❤️<br>
                    Sorry ya, meri galti thi...<br>
                    Maan jao na? 🫶🏻
                </p>
            </div>

        </div>

        <div class="yes-no">

            <button class="yes" id="yes">
                <span>Haan ❤️</span>
            </button>

            <button class="no" id="no">
                <span>Nahi 😤</span>
            </button>

        </div>

    </div>

</section>

<script src="app.js"></script>

</body>
</html>
